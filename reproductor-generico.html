<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEIP Siurot - Reproductor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 20px;
        }
        .player {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .logo {
            max-width: 120px;
            height: auto;
            margin: 0 auto 20px;
            display: block;
        }
        h1 {
            color: #333;
            margin: 0 0 10px 0;
            font-size: 20px;
            word-break: break-word;
        }
        .subtitle {
            color: #999;
            font-size: 13px;
            margin-bottom: 25px;
        }
        audio {
            width: 100%;
            margin-top: 20px;
            accent-color: #667eea;
        }
        .error {
            color: #f44336;
            padding: 15px;
            background: #ffebee;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="player">
        <img id="logo" class="logo" alt="Logo">
        <h1 id="titulo">CEIP Manuel Siurot</h1>
        <p class="subtitle">La Palma del Condado</p>
        <audio id="reproductor" controls autoplay>
            Tu navegador no soporta audio HTML5.
        </audio>
        <div id="error" class="error" style="display: none;"></div>
    </div>

    <script>
        // Obtener parámetros de la URL
        const params = new URLSearchParams(window.location.search);
        const audioUrl = params.get('audio');
        const titulo = params.get('titulo') || 'CEIP Manuel Siurot';
        const logo = params.get('logo') || 'https://raw.githubusercontent.com/ManuelVS8/Audios-juegos-SCIENCE/refs/heads/main/Web_Siurot/Logo_web.png';

        // Establecer título
        document.getElementById('titulo').textContent = titulo;
        
        // Establecer logo
        const logoImg = document.getElementById('logo');
        logoImg.src = logo;
        logoImg.onerror = () => {
            logoImg.style.display = 'none';
        };

        // Establecer audio
        const reproductor = document.getElementById('reproductor');
        if (audioUrl) {
            const source = document.createElement('source');
            source.src = audioUrl;
            source.type = 'audio/mpeg';
            reproductor.appendChild(source);
            reproductor.load();
        } else {
            document.getElementById('error').style.display = 'block';
            document.getElementById('error').textContent = '⚠️ No se especificó audio. Escanea un código QR válido.';
            reproductor.style.display = 'none';
        }
    </script>
</body>
</html>
