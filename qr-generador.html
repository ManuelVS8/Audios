<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador QR Audios</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            margin-bottom: 25px;
            color: #333;
            font-size: 22px;
        }
        .input-group {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }
        .input-row {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        label {
            color: #666;
            font-size: 12px;
            font-weight: 600;
        }
        input {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            padding: 12px 16px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            touch-action: manipulation;
        }
        button:hover { background: #45a049; }
        button:active { transform: scale(0.98); }
        
        button.danger {
            background: #f44336;
            padding: 10px 12px;
            font-size: 13px;
        }
        button.danger:hover { background: #da190b; }
        
        button.download {
            background: #2196F3;
            padding: 12px 12px;
            font-size: 13px;
            margin-top: 10px;
            width: 100%;
        }
        button.download:hover { background: #0b7dda; }
        
        .qr-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 25px;
        }
        
        .qr-card {
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            background: #fafafa;
        }
        .qr-card h3 {
            margin-bottom: 12px;
            color: #333;
            font-size: 15px;
            word-break: break-word;
        }
        .qr-container {
            background: white;
            padding: 12px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 12px;
            border: 1px solid #eee;
        }
        .empty {
            text-align: center;
            color: #999;
            padding: 30px 15px;
            font-size: 13px;
        }
        
        @media (min-width: 640px) {
            .container {
                padding: 30px;
            }
            h1 {
                font-size: 24px;
                margin-bottom: 30px;
            }
            .input-group {
                grid-template-columns: 1fr 1fr auto;
                gap: 15px;
                align-items: end;
            }
            .input-row {
                grid-column: auto;
            }
            .qr-grid {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: 30px;
                margin-top: 30px;
            }
            .qr-card {
                padding: 20px;
            }
            .qr-card h3 {
                font-size: 16px;
                margin-bottom: 15px;
            }
            .qr-container {
                padding: 15px;
                margin-bottom: 15px;
            }
        }
        
        @media (max-width: 639px) {
            body {
                padding: 15px;
            }
            .input-group button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 25px;">
            <img src="https://raw.githubusercontent.com/ManuelVS8/Audios-juegos-SCIENCE/refs/heads/main/Web_Siurot/Logo_web.png" alt="Logo" style="max-width: 80px; height: auto;">
            <h1 style="margin-bottom: 0;">Generador QR para Audios</h1>
        </div>
        
        <div class="input-group">
            <div class="input-row">
                <label>Título del audio</label>
                <input type="text" id="nombre" placeholder="Escribe el título del audio">
            </div>
            <div class="input-row">
                <label>URL del audio</label>
                <input type="url" id="url" placeholder="https://raw.githubusercontent.com/...">
            </div>
            <button onclick="agregarAudio()">Agregar</button>
        </div>

        <div id="qrContainer">
            <div class="empty">Agrega un audio para generar su QR</div>
        </div>
    </div>

    <script>
        let audios = [];
        const REPRODUCTOR_URL = 'https://cdn.jsdelivr.net/gh/ManuelVS8/Audios@main/reproductor-generico.html';
        const LOGO_URL = 'https://raw.githubusercontent.com/ManuelVS8/Audios-juegos-SCIENCE/refs/heads/main/Web_Siurot/Logo_web.png';

        function agregarAudio() {
            const titulo = document.getElementById('nombre').value.trim();
            const url = document.getElementById('url').value.trim();

            if (!titulo || !url) {
                alert('Completa título y URL');
                return;
            }

            audios.push({ titulo, url });
            document.getElementById('nombre').value = '';
            document.getElementById('url').value = '';
            renderQRs();
        }

        function generarURLReproductor(audio) {
            const params = new URLSearchParams({
                audio: audio.url,
                titulo: audio.titulo,
                logo: LOGO_URL
            });
            return `${REPRODUCTOR_URL}?${params.toString()}`;
        }

        function renderQRs() {
            const container = document.getElementById('qrContainer');
            
            if (audios.length === 0) {
                container.innerHTML = '<div class="empty">Agrega un audio para generar su QR</div>';
                return;
            }

            container.innerHTML = '<div class="qr-grid">' + audios.map((audio, i) => `
                <div class="qr-card">
                    <h3>${audio.titulo}</h3>
                    <div class="qr-container" id="qr-${i}"></div>
                    <button class="download" onclick="descargarQR(${i})">📥 Descargar QR</button>
                    <button class="danger" onclick="eliminarAudio(${i})" style="width: 100%; margin-top: 8px;">Eliminar</button>
                </div>
            `).join('') + '</div>';

            audios.forEach((audio, i) => {
                const reproductorUrl = generarURLReproductor(audio);
                new QRCode(document.getElementById(`qr-${i}`), {
                    text: reproductorUrl,
                    width: 256,
                    height: 256,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });
            });
        }

        function descargarQR(index) {
            const canvas = document.querySelector(`#qr-${index} canvas`);
            if (!canvas) return;
            
            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/png');
            link.download = `QR_${audios[index].titulo.replace(/\s+/g, '_')}.png`;
            link.click();
        }

        function eliminarAudio(index) {
            audios.splice(index, 1);
            renderQRs();
        }

        document.getElementById('url').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') agregarAudio();
        });
    </script>
</body>
</html>
