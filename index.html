<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1b3a6b">
<title>CEIP Manuel Siurot — Audioguía</title>
<style>
  :root{
    --azul:#1b3a6b;
    --azul-claro:#2f5fa8;
    --texto:#1f2430;
    --gris:#6b7280;
    --linea:#e5e7eb;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:#f2f4f8;
    color:var(--texto);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    -webkit-text-size-adjust:100%;
  }
  .tarjeta{
    background:#fff;
    width:100%;
    max-width:420px;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 6px 30px rgba(27,58,107,.13);
  }
  .cabecera{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 20px;
    background:#eef1f7;
    border-bottom:1px solid var(--linea);
  }
  .logo{max-width:40px;height:auto;display:block;flex:none}
  .nombre-centro{
    font-size:15px;
    font-weight:700;
    color:var(--azul);
    line-height:1.3;
  }
  .contenido{
    padding:24px 22px 24px;
    text-align:center;
  }
  .imagen{
    display:block;
    width:100%;
    height:auto;
    margin:0 0 20px;
    -webkit-mask-image:radial-gradient(ellipse 100% 100% at 50% 50%, #000 55%, transparent 100%);
    mask-image:radial-gradient(ellipse 100% 100% at 50% 50%, #000 55%, transparent 100%);
  }
  h1{
    font-size:22px;
    line-height:1.3;
    color:var(--azul);
    margin-bottom:22px;
    overflow-wrap:break-word;
  }
  .boton{
    width:100%;
    border:none;
    border-radius:14px;
    background:var(--azul);
    color:#fff;
    font-size:18px;
    font-weight:600;
    padding:20px 16px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    transition:background .15s;
  }
  .boton:hover{background:var(--azul-claro)}
  .boton:active{transform:scale(.99)}
  .boton:disabled{background:#9ca3af;cursor:default}
  .boton svg{width:26px;height:26px;fill:currentColor;flex:none}

  audio{width:100%;margin-top:18px;display:none}
  audio.visible{display:block}

  .aviso{
    margin-top:18px;
    padding:14px;
    border-radius:12px;
    font-size:14px;
    line-height:1.5;
    display:none;
  }
  .aviso.error{display:block;background:#fdecea;color:#b3261e}
  .aviso a{color:inherit}

  .plano{
    display:block;
    width:100%;
    height:auto;
    margin-top:20px;
    border-radius:12px;
    border:1px solid var(--linea);
  }

  .enlace-web{
    display:inline-block;
    margin-top:20px;
    color:var(--azul-claro);
    font-size:14px;
    font-weight:600;
    text-decoration:none;
  }
  .enlace-web:hover,
  .enlace-web:focus{text-decoration:underline}

  .pie{
    margin-top:16px;
    padding-top:16px;
    border-top:1px solid var(--linea);
    font-size:12px;
    color:var(--gris);
  }
</style>
</head>
<body>

<main class="tarjeta">
  <div class="cabecera">
    <img id="logo" class="logo" alt="" hidden>
    <span class="nombre-centro">CEIP Manuel Siurot</span>
  </div>

  <div class="contenido">
    <img id="imagenPrincipal" class="imagen" alt="" hidden>
    <h1 id="titulo">Audioguía</h1>

    <button id="play" class="boton">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      <span id="playTexto">Escuchar audio</span>
    </button>

    <audio id="audio" preload="metadata" controls></audio>

    <div id="aviso" class="aviso"></div>

    <img class="plano" src="plano.jpg" alt="Plano del centro" onerror="this.remove()">

    <a class="enlace-web" href="https://ceipmanuelsiurot.es" target="_blank" rel="noopener">ceipmanuelsiurot.es</a>

    <p class="pie">La Palma del Condado</p>
  </div>
</main>

<script>
(function(){
  var p       = new URLSearchParams(location.search);
  var archivo = p.get('a') || p.get('audio') || '';
  var imagenP = p.get('img') || p.get('imagen') || '';
  var titulo  = p.get('t') || p.get('titulo') || '';
  var logoUrl = p.get('logo') || 'https://raw.githubusercontent.com/ManuelVS8/Audios-juegos-SCIENCE/main/Web_Siurot/Logo_web.png';

  var audio    = document.getElementById('audio');
  var play     = document.getElementById('play');
  var playTxt  = document.getElementById('playTexto');
  var aviso    = document.getElementById('aviso');
  var logo     = document.getElementById('logo');
  var imagen   = document.getElementById('imagenPrincipal');

  // Resuelve nombres sueltos ("sala1") frente a URLs completas o con extensión.
  function resolver(nombre, extension){
    if (!nombre) return '';
    if (/^https?:\/\//i.test(nombre)) return nombre;
    return /\.[a-z0-9]+$/i.test(nombre) ? nombre : nombre + '.' + extension;
  }

  var imagenSrc = resolver(imagenP, 'jpg');
  if (imagenSrc) {
    imagen.onload  = function(){ imagen.hidden = false; };
    imagen.onerror = function(){ imagen.remove(); };
    imagen.src = imagenSrc;
  } else {
    imagen.remove();
  }

  if (logoUrl) {
    logo.onload  = function(){ logo.hidden = false; };
    logo.onerror = function(){ logo.remove(); };
    logo.src = logoUrl;
  }

  if (titulo) document.getElementById('titulo').textContent = titulo;

  function error(msg){
    aviso.className = 'aviso error';
    aviso.innerHTML = msg;
    play.disabled = true;
    playTxt.textContent = 'Audio no disponible';
    audio.classList.remove('visible');
  }

  if (!archivo) {
    error('Este enlace no indica ningún audio. Vuelve a escanear el código QR.');
    return;
  }

  audio.src = resolver(archivo, 'mp3');

  audio.addEventListener('error', function(){
    error('No se ha podido cargar el audio. Comprueba tu conexión a internet e inténtalo de nuevo.');
  });

  play.addEventListener('click', function(){
    // El autoplay está bloqueado en móviles: la reproducción arranca con este toque.
    audio.play().then(function(){
      play.style.display = 'none';
      audio.classList.add('visible');
    }).catch(function(){
      // Si falla, se muestran los controles nativos como alternativa.
      audio.classList.add('visible');
      playTxt.textContent = 'Usa los controles de abajo';
    });
  });
})();
</script>

</body>
</html>
