<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1b3a6b">
<title>CEIP Manuel Siurot — Audioguía</title>
<style>
  :root{
    --azul:#1b3a6b;
    --azul-claro:#2f5fa8;
    --texto:#1f2430;
    --gris:#6b7280;
    --linea:#e5e7eb;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:#f2f4f8;
    color:var(--texto);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    -webkit-text-size-adjust:100%;
  }
  .tarjeta{
    background:#fff;
    width:100%;
    max-width:420px;
    border-radius:18px;
    box-shadow:0 6px 30px rgba(27,58,107,.13);
    padding:28px 22px 24px;
    text-align:center;
  }
  .logo{max-width:110px;height:auto;margin:0 auto 18px;display:block}
  .centro{
    font-size:12px;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--gris);
    margin-bottom:6px;
  }
  h1{
    font-size:22px;
    line-height:1.3;
    color:var(--azul);
    margin-bottom:22px;
    overflow-wrap:break-word;
  }
  .boton{
    width:100%;
    border:none;
    border-radius:14px;
    background:var(--azul);
    color:#fff;
    font-size:18px;
    font-weight:600;
    padding:20px 16px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    transition:background .15s;
  }
  .boton:hover{background:var(--azul-claro)}
  .boton:active{transform:scale(.99)}
  .boton:disabled{background:#9ca3af;cursor:default}
  .boton svg{width:26px;height:26px;fill:currentColor;flex:none}

  audio{width:100%;margin-top:18px;display:none}
  audio.visible{display:block}

  .aviso{
    margin-top:18px;
    padding:14px;
    border-radius:12px;
    font-size:14px;
    line-height:1.5;
    display:none;
  }
  .aviso.error{display:block;background:#fdecea;color:#b3261e}
  .aviso a{color:inherit}

  .pie{
    margin-top:22px;
    padding-top:16px;
    border-top:1px solid var(--linea);
    font-size:12px;
    color:var(--gris);
  }
</style>
</head>
<body>

<main class="tarjeta">
  <img id="logo" class="logo" alt="" hidden>
  <p class="centro">CEIP Manuel Siurot</p>
  <h1 id="titulo">Audioguía</h1>

  <button id="play" class="boton">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
    <span id="playTexto">Escuchar audio</span>
  </button>

  <audio id="audio" preload="metadata" controls></audio>

  <div id="aviso" class="aviso"></div>

  <p class="pie">La Palma del Condado · Jornada de Puertas Abiertas</p>
</main>

<script>
(function(){
  var p       = new URLSearchParams(location.search);
  var archivo = p.get('a') || p.get('audio') || '';
  var titulo  = p.get('t') || p.get('titulo') || '';
  var logoUrl = p.get('logo') || 'https://raw.githubusercontent.com/ManuelVS8/Audios-juegos-SCIENCE/main/Web_Siurot/Logo_web.png';

  var audio    = document.getElementById('audio');
  var play     = document.getElementById('play');
  var playTxt  = document.getElementById('playTexto');
  var aviso    = document.getElementById('aviso');
  var logo     = document.getElementById('logo');

  if (logoUrl) {
    logo.onload  = function(){ logo.hidden = false; };
    logo.onerror = function(){ logo.remove(); };
    logo.src = logoUrl;
  }

  if (titulo) document.getElementById('titulo').textContent = titulo;

  function error(msg){
    aviso.className = 'aviso error';
    aviso.innerHTML = msg;
    play.disabled = true;
    playTxt.textContent = 'Audio no disponible';
    audio.classList.remove('visible');
  }

  if (!archivo) {
    error('Este enlace no indica ningún audio. Vuelve a escanear el código QR.');
    return;
  }

  // Si es una URL completa se usa tal cual; si no, se resuelve junto a esta página.
  var src = /^https?:\/\//i.test(archivo)
    ? archivo
    : (/\.[a-z0-9]+$/i.test(archivo) ? archivo : archivo + '.mp3');

  audio.src = src;

  audio.addEventListener('error', function(){
    error('No se ha podido cargar el audio. Comprueba tu conexión a internet e inténtalo de nuevo.');
  });

  play.addEventListener('click', function(){
    // El autoplay está bloqueado en móviles: la reproducción arranca con este toque.
    audio.play().then(function(){
      play.style.display = 'none';
      audio.classList.add('visible');
    }).catch(function(){
      // Si falla, se muestran los controles nativos como alternativa.
      audio.classList.add('visible');
      playTxt.textContent = 'Usa los controles de abajo';
    });
  });
})();
</script>

</body>
</html>
